<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuper TV - Videos Reales</title>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            background-color: #080b11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .player-box {
            width: 100%;
            height: 45vh;
            background-color: #000000;
        }
        video {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        .menu-box {
            height: 55vh;
            padding: 20px;
            overflow-y: auto;
        }
        .lista-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 700px;
            margin: 0 auto;
        }
        .item-canal {
            background-color: #131924;
            padding: 35px 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 12px;
            border: 4px solid transparent;
            color: #cfd8e3;
            cursor: pointer;
            transition: 0.1s;
        }
        .item-canal:hover, .item-canal.focus {
            border-color: #00ff88;
            background-color: #1c2536;
            color: #ffffff;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <div class="player-box">
        <!-- El primer video cargará de forma automática al abrir la web -->
        <video id="main-player" controls autoplay playsinline>
            <source src="https://googleapis.com" type="video/mp4">
        </video>
    </div>

    <div class="menu-box">
        <div class="lista-vertical">
            <!-- Enlaces reales verificados que transmiten video de verdad -->
            <div class="item-canal focus" onclick="reproducirVideo('https://googleapis.com', this)">🎬 PELÍCULA: BIG BUCK BUNNY</div>
            <div class="item-canal" onclick="reproducirVideo('https://googleapis.com', this)">🎬 CORTOMETRAJE: ELEPHANTS DREAM</div>
            <div class="item-canal" onclick="reproducirVideo('https://googleapis.com', this)">🔥 VIDEO TEST: FOR BIGGER BLAZES</div>
            <div class="item-canal" onclick="reproducirVideo('https://googleapis.com', this)">🚗 CLIPS: SUBARU OUTBACK</div>
        </div>
    </div>

    <script>
        const player = document.getElementById('main-player');

        function reproducirVideo(url, elemento) {
            document.querySelectorAll('.item-canal').forEach(el => el.classList.remove('focus'));
            elemento.classList.add('focus');
            
            player.src = url;
            player.load();
            player.play();
        }
    </script>
</body>
</html>
