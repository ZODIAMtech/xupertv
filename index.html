<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuper TV - Navegación Corregida</title>
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        * { 
            box-sizing: border-box; 
            /* Evita que el celular y la TV seleccionen el texto al mantener presionado o usar el cursor */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            background-color: #080b11;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .player-box {
            width: 100%;
            height: 50vh;
            background-color: #000000;
        }
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        .menu-box {
            height: 50vh;
            padding: 25px;
            overflow-y: auto;
        }
        .grid-canales {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .item-canal {
            background-color: #131924;
            padding: 25px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
            border: 4px solid transparent;
            color: #cfd8e3;
            cursor: pointer;
        }
        .item-canal.focus {
            border-color: #00ff88;
            background-color: #1c2536;
            color: #ffffff;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="player-box">
        <video id="tv-player" class="video-js vjs-default-skin" controls preload="auto">
            <source src="https://ctedge.com" type="application/x-mpegURL">
        </video>
    </div>

    <div class="menu-box">
        <div class="grid-canales">
            <!-- Funciona al toque en celular (onclick) y con control remoto en la tele -->
            <div class="item-canal focus" onclick="reproducirEnlace('https://ctedge.com', 0)">📺 TELESUR</div>
            <div class="item-canal" onclick="reproducirEnlace('https://rtvc-live-vpaid.com', 1)">📰 RTVC NOTICIAS</div>
            <div class="item-canal" onclick="reproducirEnlace('https://b-cdn.net', 2)">🎬 CANAL 26</div>
            <div class="item-canal" onclick="reproducirEnlace('https://akamaihd.net', 3)">⭐ DW ESPAÑOL</div>
        </div>
    </div>

    <script src="https://zencdn.net"></script>
    <script>
        let currentIndex = 0;
        const canales = document.querySelectorAll('.item-canal');
        const vjsPlayer = videojs('tv-player');

        // Función universal para clics y control remoto
        function reproducirEnlace(url, index) {
            canales[currentIndex].classList.remove('focus');
            currentIndex = index;
            canales[currentIndex].classList.add('focus');
            
            vjsPlayer.src({ type: 'application/x-mpegURL', src: url });
            vjsPlayer.play().catch(function(error) {
                console.log("Error al reproducir: ", error);
            });
        }

        // CONTROL EXCLUSIVO PARA LAS FLECHAS DE LA TELEVISIÓN
        document.addEventListener('keydown', function(e) {
            canales[currentIndex].classList.remove('focus');

            if (e.key === 'ArrowRight' && currentIndex % 2 === 0) {
                currentIndex++;
            } else if (e.key === 'ArrowLeft' && currentIndex % 2 === 1) {
                currentIndex--;
            } else if (e.key === 'ArrowDown' && currentIndex < 2) {
                currentIndex += 2;
            } else if (e.key === 'ArrowUp' && currentIndex >= 2) {
                currentIndex -= 2;
            } else if (e.key === 'Enter') {
                // Simula un clic real sobre el botón enfocado por el control remoto
                canales[currentIndex].click();
            }

            canales[currentIndex].classList.add('focus');
        });
    </script>
</body>
</html>
